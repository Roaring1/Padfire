[package]
name = "padfire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native cross-platform Padfire soundboard and Launchpad controller"

[[bin]]
name = "padfire"
path = "src/main.rs"

[dependencies]
padfire-core = { version = "3.0.0-alpha.1", path = "../../crates/padfire-core" }
padfire-platform = { version = "3.0.0-alpha.1", path = "../../crates/padfire-platform" }
rfd = { version = "0.15.4", default-features = true }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
libc = "0.2"
nix = { version = "0.30", features = ["user"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
