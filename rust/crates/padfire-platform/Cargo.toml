[package]
name = "padfire-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows and Linux adapters for Padfire audio, MIDI, process, storage and IPC"

[dependencies]
padfire-core = { path = "../padfire-core" }
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
midir = "0.11.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis", "mp4"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
nix = { version = "0.30", features = ["user", "signal", "process"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
