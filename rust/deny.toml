# Dependency policy for the Padfire Rust candidate.
# Run with: cargo deny check

[graph]
all-features = true

[advisories]
# Do not silently accept known vulnerabilities or yanked packages.
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[bans]
# Several foundational UI/audio crates currently resolve compatible duplicate
# versions. Report them for review, but do not block the candidate until each
# duplicate has been assessed for target/features and upstream compatibility.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# Evaluate runtime, test, and build dependencies. No GPL/LGPL-only license is
# allowed globally. Dual-license expressions can satisfy an allowed option.
include-dev = true
include-build = true
confidence-threshold = 0.93
unused-allowed-license = "warn"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
