[workspace]
members = ["crates/padfire-core", "crates/padfire-platform", "apps/padfire"]
resolver = "3"

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Roaring1/Padfire"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
